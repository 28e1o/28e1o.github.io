<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: radial-gradient(ellipse at 50% 50%, #151529 0%, #0b0b0f 60%, #07070a 100%);
    color: #f0f0f5;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    cursor: default;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 80%, rgba(100,100,200,0.04) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 20%, rgba(200,100,180,0.03) 0%, transparent 60%);
    pointer-events: none;
    z-index: -1;
  }

  canvas {
    position: fixed;
    top: 0; right: 0; bottom: 0; left: 0;
    z-index: 0;
  }

  main {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 2rem;
    transition: transform 0.15s ease-out;
  }

  h1 {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: clamp(8rem, 25vw, 20rem);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -0.06em;
    position: relative;
    display: inline-block;
    cursor: default;
    transition: filter 0.2s ease;
  }

  h1 .num {
    display: inline-block;
    background: linear-gradient(135deg, #5a5a70 0%, #252540 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: fadeUp 0.8s ease-out both;
  }

  h1 .num:nth-child(1) { animation-delay: 0s; }
  h1 .num:nth-child(2) { animation-delay: 0.06s; }
  h1 .num:nth-child(3) { animation-delay: 0.12s; }

  @keyframes glitch {
    0% { clip-path: inset(0 0 80% 0); transform: translate(-2px, 2px); }
    10% { clip-path: inset(20% 0 60% 0); transform: translate(2px, -1px); }
    20% { clip-path: inset(40% 0 40% 0); transform: translate(-1px, 1px); }
    30% { clip-path: inset(60% 0 20% 0); transform: translate(1px, -2px); }
    40% { clip-path: inset(80% 0 0 0); transform: translate(-2px, 0); }
    50% { clip-path: inset(0 0 70% 0); transform: translate(2px, 1px); }
    60% { clip-path: inset(30% 0 50% 0); transform: translate(-1px, -1px); }
    70% { clip-path: inset(50% 0 30% 0); transform: translate(1px, 2px); }
    80% { clip-path: inset(70% 0 10% 0); transform: translate(-2px, -2px); }
    90% { clip-path: inset(10% 0 70% 0); transform: translate(2px, 0); }
    100% { clip-path: inset(0 0 80% 0); transform: translate(-2px, 2px); }
  }

  h1 .glitch-ghost {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #ff4d6d 0%, #ff8c42 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    opacity: 0;
    pointer-events: none;
  }

  h1:hover .glitch-ghost {
    animation: glitch 0.8s infinite steps(1);
    opacity: 0.7;
  }

  p {
    font-size: clamp(1rem, 2.5vw, 1.5rem);
    font-weight: 300;
    color: #8888aa;
    margin-top: 1rem;
    letter-spacing: 0.02em;
    animation: fadeUp 0.8s 0.2s ease-out both;
    transition: color 0.3s ease;
  }

  p:hover {
    color: #b0b0d0;
  }

  .action {
    margin-top: 2.5rem;
    animation: fadeUp 0.8s 0.35s ease-out both;
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 2rem;
    border-radius: 100px;
    font-family: 'Inter', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    text-decoration: none;
    transition: all 0.25s ease;
    cursor: pointer;
    border: 1.5px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    color: #c0c0da;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    transform: translateY(-2px);
  }

  .btn svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .glow {
    position: fixed;
    width: 90vmax;
    height: 90vmax;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(100,100,200,0.07) 0%, transparent 65%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: -1;
    animation: pulse 4s ease-in-out infinite;
  }

  .glow-2 {
    width: 70vmax;
    height: 70vmax;
    background: radial-gradient(circle, rgba(200,100,180,0.04) 0%, transparent 65%);
    top: 30%;
    left: 70%;
    animation: pulse 5s ease-in-out infinite reverse;
    animation-delay: 1s;
  }

  .glow-3 {
    width: 80vmax;
    height: 80vmax;
    background: radial-gradient(circle, rgba(80,160,220,0.03) 0%, transparent 65%);
    top: 70%;
    left: 30%;
    animation: pulse 6s ease-in-out infinite;
    animation-delay: 2s;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  }

  @media (max-width: 480px) {
    .action { flex-direction: column; align-items: center; }
    .btn { width: 100%; max-width: 220px; justify-content: center; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="glow"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<main id="main">
  <h1 id="title">
    <span class="num">4</span>
    <span class="num">0</span>
    <span class="num">4</span>
    <span class="glitch-ghost" aria-hidden="true">404</span>
  </h1>
  <p>This page no longer exists or has moved.</p>

  <div class="action">
    <a href="/" class="btn btn-secondary">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m-4-1h4m0 0V7a1 1 0 011-1h2a1 1 0 011 1v3m0 0V17a1 1 0 001 1h3a1 1 0 001-1v-7"/></svg>
      Home
    </a>
  </div>
</main>

<script>
  (function() {
    const c = document.getElementById('particles');
    const ctx = c.getContext('2d');
    let particles = [], w, h;

    function resize() {
      w = c.width = innerWidth;
      h = c.height = innerHeight;
    }
    resize();
    addEventListener('resize', resize);

    const NUM = Math.min(90, Math.floor((w * h) / 14000));

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * w;
        this.y = Math.random() * h;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        this.r = Math.random() * 2 + 0.5;
        this.a = Math.random() * 0.35 + 0.08;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > w) this.vx *= -1;
        if (this.y < 0 || this.y > h) this.vy *= -1;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(180,180,230,${this.a})`;
        ctx.fill();
      }
    }

    for (let i = 0; i < NUM; i++) particles.push(new Particle());

    let mouse = { x: w / 2, y: h / 2, prevX: w / 2, prevY: h / 2 };
    addEventListener('mousemove', e => {
      mouse.prevX = mouse.x;
      mouse.prevY = mouse.y;
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    function drawLines() {
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          const maxDist = 140;
          if (dist < maxDist) {
            const alpha = (1 - dist / maxDist) * 0.2;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.strokeStyle = `rgba(180,180,230,${alpha})`;
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        }
      }
    }

    function drawMouseConnection() {
      for (const p of particles) {
        const dx = p.x - mouse.x;
        const dy = p.y - mouse.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const maxDist = 160;
        if (dist < maxDist) {
          const alpha = (1 - dist / maxDist) * 0.3;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = `rgba(200,200,250,${alpha})`;
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }
    }

    const main = document.getElementById('main');
    let targetX = 0, targetY = 0, currentX = 0, currentY = 0;

    function updateParallax() {
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;
      targetX = (mouse.x - cx) / cx;
      targetY = (mouse.y - cy) / cy;
      currentX += (targetX - currentX) * 0.05;
      currentY += (targetY - currentY) * 0.05;
      main.style.transform = `translate(${currentX * 12}px, ${currentY * 12}px)`;
      requestAnimationFrame(updateParallax);
    }
    updateParallax();

    const title = document.getElementById('title');

    function triggerGlitch() {
      const ghost = title.querySelector('.glitch-ghost');
      ghost.style.opacity = '0.7';
      ghost.style.animation = 'none';
      void ghost.offsetHeight;
      ghost.style.animation = 'glitch 0.3s steps(1)';
      setTimeout(() => { ghost.style.opacity = '0'; }, 300);
    }

    setInterval(triggerGlitch, 3000);

    title.addEventListener('click', triggerGlitch);

    function loop() {
      ctx.clearRect(0, 0, w, h);
      for (const p of particles) { p.update(); p.draw(); }
      drawLines();
      drawMouseConnection();
      requestAnimationFrame(loop);
    }
    loop();
  })();
</script>
</body>
</html>
