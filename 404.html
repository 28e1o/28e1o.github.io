<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 ♡ lost in the clouds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffb8d9;
    --pink-deep: #ff8fc0;
    --lav: #c9b6ff;
    --mint: #b8f2e6;
    --cream: #fff5fa;
    --ink: #6b4a63;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, #ffe3f1 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #e7e0ff 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #d6f7ee 0%, transparent 50%),
      linear-gradient(160deg, #fff5fa 0%, #fde9f5 100%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
    padding: 2rem 1rem;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.55;
    z-index: 0;
    animation: float 9s ease-in-out infinite;
  }
  .blob.b1 { width: 280px; height: 280px; background: #ffc2e2; top: -60px; left: -40px; }
  .blob.b2 { width: 240px; height: 240px; background: #c5b8ff; bottom: -50px; right: -30px; animation-delay: 1.5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(15px); }
  }

  main {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(12px);
    border: 3px solid #ffd6ec;
    border-radius: 36px;
    padding: 3rem 2.5rem;
    box-shadow: 0 20px 50px rgba(255, 150, 200, 0.25);
    max-width: 520px;
    animation: pop 0.7s cubic-bezier(.18,.89,.32,1.28) both;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .ghost {
    font-size: 4.5rem;
    animation: bounce 2.2s ease-in-out infinite;
    display: inline-block;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50% { transform: translateY(-18px) rotate(3deg); }
  }

  h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(4rem, 18vw, 7rem);
    font-weight: 800;
    line-height: 1;
    margin: 0.3rem 0;
    background: linear-gradient(120deg, var(--pink-deep), var(--lav));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.05em;
  }

  p {
    font-size: 1.1rem;
    font-weight: 500;
    opacity: 0.85;
    margin-bottom: 2rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 2rem;
    border-radius: 100px;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    color: #fff;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    box-shadow: 0 8px 18px rgba(255, 143, 192, 0.4);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    border: none;
  }
  .btn:hover {
    transform: translateY(-4px) rotate(-2deg);
    box-shadow: 0 14px 26px rgba(255, 143, 192, 0.5);
  }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .floating {
    position: fixed;
    z-index: 1;
    opacity: 0.7;
    animation: rise linear infinite;
    pointer-events: none;
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  @media (max-width: 480px) {
    main { padding: 2.2rem 1.6rem; }
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<main>
  <div class="ghost">🌸</div>
  <h1>404</h1>
  <p>oopsie! this page wandered off into the clouds ♡</p>
  <a href="https://youtu.be/dQw4w9WgXcQ?si=6ylo52bZ0t4-ZJbK" class="btn">
    <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m-4-1h4m0 0V7a1 1 0 011-1h2a1 1 0 011 1v3m0 0V17a1 1 0 001 1h3a1 1 0 001-1v-7"/></svg>
    take me home
  </a>
</main>

<script>
  const icons = ['🌸','💖','⭐','🍓','🐰','✨','🍡','🧁','☁️'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('div');
    s.className = 'floating';
    s.textContent = icons[Math.floor(Math.random() * icons.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.bottom = '-10vh';
    const dur = 8 + Math.random() * 10;
    s.style.animationDuration = dur + 's';
    s.style.animationDelay = (Math.random() * dur) + 's';
    s.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
