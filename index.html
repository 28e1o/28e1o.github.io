<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✦ yay, redirecting~ ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ffb8d9;
    --pink-deep: #ff8fc0;
    --lav: #c9b6ff;
    --mint: #b8f2e6;
    --cream: #fff5fa;
    --ink: #6b4a63;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Quicksand', sans-serif;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 20%, #ffe3f1 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #e7e0ff 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, #d6f7ee 0%, transparent 50%),
      linear-gradient(160deg, #fff5fa 0%, #fde9f5 100%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    position: relative;
    padding: 2rem 1rem;
  }

  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.55;
    z-index: 0;
    animation: float 9s ease-in-out infinite;
  }
  .blob.b1 { width: 280px; height: 280px; background: #ffc2e2; top: -60px; left: -40px; }
  .blob.b2 { width: 240px; height: 240px; background: #c5b8ff; bottom: -50px; right: -30px; animation-delay: 1.5s; }
  .blob.b3 { width: 200px; height: 200px; background: #aef3e4; top: 40%; right: 10%; animation-delay: 3s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-30px) translateX(15px); }
  }

  main {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.55);
    backdrop-filter: blur(12px);
    border: 3px solid #ffd6ec;
    border-radius: 36px;
    padding: 3rem 2.5rem;
    box-shadow: 0 20px 50px rgba(255, 150, 200, 0.25);
    max-width: 460px;
    animation: pop 0.7s cubic-bezier(.18,.89,.32,1.28) both;
  }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .sparkle { font-size: 2.2rem; animation: wiggle 2.5s ease-in-out infinite; }
  .sparkle:nth-child(2) { animation-delay: 0.4s; }
  .sparkle:nth-child(3) { animation-delay: 0.8s; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-12deg) scale(1.15); }
    75% { transform: rotate(12deg) scale(1.15); }
  }

  h1 {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    font-weight: 800;
    margin: 0.5rem 0 0.3rem;
    background: linear-gradient(120deg, var(--pink-deep), var(--lav));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-size: 1.05rem;
    font-weight: 500;
    opacity: 0.85;
    margin-bottom: 1.8rem;
  }

  .dots { display: inline-flex; gap: 0.5rem; margin-top: 0.4rem; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: linear-gradient(135deg, var(--pink), var(--pink-deep));
    animation: hop 1s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.15s; background: linear-gradient(135deg, #d6c4ff, var(--lav)); }
  .dot:nth-child(3) { animation-delay: 0.3s; background: linear-gradient(135deg, #c6f5ea, var(--mint)); }
  @keyframes hop {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(-12px); opacity: 1; }
  }

  .floating {
    position: fixed;
    z-index: 1;
    opacity: 0.7;
    animation: rise linear infinite;
    pointer-events: none;
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>
<div class="blob b3"></div>

<main>
  <div>
    <span class="sparkle">✦</span>
    <span class="sparkle">♡</span>
    <span class="sparkle">✿</span>
  </div>
  <h1>redirecting you~ ♡</h1>
  <p class="tagline">hold on tight, off we go! 🍓</p>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</main>

<script>
  const icons = ['🌸','💖','⭐','🍓','🐰','✨','🍡','🧁'];
  for (let i = 0; i < 14; i++) {
    const s = document.createElement('div');
    s.className = 'floating';
    s.textContent = icons[Math.floor(Math.random() * icons.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.bottom = '-10vh';
    const dur = 8 + Math.random() * 10;
    s.style.animationDuration = dur + 's';
    s.style.animationDelay = (Math.random() * dur) + 's';
    s.style.fontSize = (1 + Math.random() * 1.4) + 'rem';
    document.body.appendChild(s);
  }

  function randomPath(length = 8) {
    const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    let result = "";
    for (let i = 0; i < length; i++) {
      result += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return "/" + result;
  }

  setTimeout(() => window.location.replace(randomPath()), 1400);
</script>
</body>
</html>
